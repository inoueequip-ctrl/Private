# Androidアプリ(android/)をビルドして、デバッグAPKを成果物として保存します。
name: Build Android app

on:
  pull_request:
    paths: ['android/**', 'digipet/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'digipet/**']
  workflow_dispatch:

permissions:
  contents: write   # 最新APKをリリースページに置くため

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ランナーには Android SDK が入っているので、ライセンス承認だけ行う
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guardon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # main に入ったときだけ、誰でもダウンロードできるリリースページへ最新APKを置く
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk guardon.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --target "$GITHUB_SHA" --title "ガードン 最新版 (Android)" \
            --notes "guardon.apk をスマホで開いてインストール。ホーム画面を長押し→ウィジェット→ガードン。"
          gh release upload latest guardon.apk --clobber
