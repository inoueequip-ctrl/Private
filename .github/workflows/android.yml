# Androidアプリ(android/)をビルドして、デバッグAPKを成果物として保存します。
name: Build Android app

on:
  pull_request:
    paths: ['android/**', 'digipet/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'digipet/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ランナーには Android SDK が入っているので、ライセンス承認だけ行う
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guardon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
